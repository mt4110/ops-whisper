name: Bug report / 不具合報告
description: Report a problem using synthetic data / 架空のデータで再現してください
body:
  - type: markdown
    attributes:
      value: |
        The CLI is not implemented yet. Documentation problems are welcome.
        本体は未実装です。文書の不具合も報告できます。
        Never attach real logs, credentials, client names, private rules, or alias maps.
        For vulnerabilities, read SECURITY.md; do not disclose details publicly.
  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive information / 機密情報
      options:
        - label: This report contains only synthetic data and no vulnerability disclosure details.
          required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment / 版と環境
      description: For documentation, provide the commit or file name. Do not include private paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic reproduction / 手順と架空の再現
      description: Provide the smallest reproduction. No actual logs or credentials.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 期待と実際
    validations:
      required: true
