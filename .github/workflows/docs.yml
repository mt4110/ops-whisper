name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Validate documentation
        run: python3 scripts/check_docs.py
      - name: Install search test dependency
        run: |
          archive="$RUNNER_TEMP/ripgrep.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/BurntSushi/ripgrep/releases/download/16.0.0/ripgrep-16.0.0-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' 54268ab4643c00a290a29b0086066d64b3f56236dd805ec64629a86f9bd29fd0 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ripgrep-16.0.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Test local search with synthetic fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Reproduce synthetic evidence comparison
        run: python3 scripts/run_search_trial.py

  osv:
    name: OSV dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner
        run: |
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location --output "$scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          printf '%s  %s\n' fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8 "$scanner" | sha256sum --check
          chmod +x "$scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan dependencies
        run: scripts/check_dependencies.sh .
